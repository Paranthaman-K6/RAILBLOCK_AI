[package]
name = "railblock_rs"
version = "0.1.0"
edition = "2021"
description = "RailBlock AI heavy-calc Rust extension — PyO3 + rayon deep implementation"
license = "MIT"

[lib]
name = "railblock_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
